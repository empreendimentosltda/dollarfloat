<!DOCTYPE html>
<html lang="pt-BR">
<head>

  .status-text { color: var(--text-muted); margin-bottom: 32px; }

<div class="status-page">

    <div class="status-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 6V15L20 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

<a href="/" class="btn btn-ghost" style="margin-top:24px;">Voltar à loja</a>
