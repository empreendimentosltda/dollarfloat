<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento não concluído — Dollar Float Lamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .status-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .status-card { max-width: 460px; }
  .status-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(232,116,106,0.14); color: #E8746A;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .status-title { font-family: var(--font-display); font-size: 28px; margin: 0 0 12px; }
  .status-text { color: var(--text-muted); margin-bottom: 32px; }
</style>
</head>
<body>
<div class="status-page">
  <div class="status-card">
    <div class="status-icon">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M7 7L19 19M19 7L7 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <h1 class="status-title">Pagamento não concluído</h1>
    <p class="status-text">Não finalizamos seu pagamento dessa vez. Nenhum valor foi cobrado. Você pode tentar novamente quando quiser.</p>
    <a href="/#comprar" class="btn btn-primary">Tentar novamente</a>
  </div>
</div>
</body>
</html>
